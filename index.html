/* Eingaben vereinheitlichen */
function normalisieren(s){
return s
.trim()
.toLowerCase()
.replaceAll("ä","ae")
.replaceAll("ö","oe")
.replaceAll("ü","ue")
.replaceAll("ß","ss");
}


/* Lösung verschlüsselt vergleichen */
async function hash(s){
let daten = await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(normalisieren(s))
);

return [...new Uint8Array(daten)]
.map(x=>x.toString(16).padStart(2,"0"))
.join("");
}


/* QR-Parameter auslesen */

let team = (parameter.get("team") || "").toLowerCase();
let station = +parameter.get("station");

let mission = M[team]?.[station-1];

let app = document.querySelector("#app");


/* Ungültiger QR-Code */
if(!mission){

app.innerHTML = `
<h1>PROJECT X</h1>
<p>Dieser QR-Code ist nicht gültig.</p>
`;

}


/* Mission anzeigen */
else{

let accept =
mission.kind === "video"
? "video/*"
: "image/*";

let label =
mission.kind === "video"
? "📹 Video aufnehmen / auswählen"
: "📸 Foto aufnehmen / auswählen";


app.innerHTML = `

<span class="badge">
${team==="rot" ? "TEAM ROT" : "TEAM BLAU"}
· MISSION ${mission.station}/10
</span>

<h1>
${mission.emoji} ${mission.title}
</h1>

<div class="task">

<br><br>
${mission.task}
</div>


<div class="proof">

<b>${label}</b>

<br><br>

<small>
⚠️ Ohne Foto oder Video wird der nächste Hinweis NICHT freigeschaltet.
</small>

<input
id="proof"
type="file"
accept="${accept}"
capture="environment"
>

<div id="filename"></div>

</div>


<h3>🧩 RÄTSEL</h3>

<p>${mission.riddle}</p>

<input
id="x"
autocomplete="off"
placeholder="Eure Lösung hier eingeben"
>

<button id="b">
🔐 MISSION PRÜFEN
</button>

<div id="r"></div>

`;


/* Dateiname anzeigen */
proof.onchange = () => {

filename.textContent =
proof.files.length
? "✅ Beweis ausgewählt: " + proof.files[0].name
: "";

};


/* Mission prüfen */
b.onclick = async () => {

let ausgabe = document.querySelector("#r");

let richtig =
await hash(x.value) === mission.hash;

let datei =
proof.files.length > 0;


/* Lösung falsch + kein Beweis */
if(!richtig && !datei){

ausgabe.className="bad";

ausgabe.innerHTML =
"❌ Die Lösung stimmt noch nicht UND euer Foto/Video fehlt.";

}


/* Lösung falsch */
else if(!richtig){

ausgabe.className="bad";

ausgabe.innerHTML =
"❌ Euer Foto/Video ist vorhanden, aber die Lösung stimmt noch nicht. Versucht es erneut!";

}


/* Lösung richtig, Beweis fehlt */
else if(!datei){

ausgabe.className="bad";

ausgabe.innerHTML =
"✅ Eure Lösung ist richtig!<br><br>📸 Aber euer Beweisfoto/-video fehlt noch. Erst danach bekommt ihr den nächsten Hinweis.";

}


/* ALLES RICHTIG */
else{

ausgabe.className="ok";

ausgabe.innerHTML = `

<b>🎉 MISSION ERFÜLLT!</b>

<br><br>

Ihr habt die Aufgabe erledigt und die richtige Lösung gefunden.

<br><br>

<b>🔎 EUER NÄCHSTER HINWEIS:</b>

<br><br>

${mission.next}

`;

x.disabled=true;
proof.disabled=true;

}

};

}
