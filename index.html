/* =========================================================
   NORMALISIERUNG VON ANTWORTEN
   ========================================================= */

function normalize(text) {

    return text
        .trim()
        .toLowerCase()
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss");

}


/* =========================================================
   SHA-256
   Die Lösungen werden nicht einfach im HTML angezeigt.
   ========================================================= */

async function createHash(text) {

    const data = new TextEncoder().encode(
        normalize(text)
    );

    const buffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return [...new Uint8Array(buffer)]
        .map(
            byte =>
            byte
            .toString(16)
            .padStart(2, "0")
        )
        .join("");

}


/* =========================================================
   URL AUSLESEN
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const team =
    (params.get("team") || "")
    .toLowerCase();

const station =
    parseInt(
        params.get("station") || "0",
        10
    );


/* =========================================================
   MISSION LADEN
   ========================================================= */

const app =
    document.getElementById("app");

const mission =
    missions[team]?.[station - 1];


if (!mission) {

    app.innerHTML = `
        <h1>PROJECT X</h1>
        <p>
            Dieser QR-Code ist nicht gültig.
        </p>
    `;

} else {

    const teamName =
        team === "rot"
        ? "TEAM ROT"
        : "TEAM BLAU";


    app.innerHTML = `

        <span class="badge">
            ${teamName} · Station ${station}/7
        </span>

        <h1>
            ${mission.emoji}
            ${mission.title}
        </h1>

        <div class="task">

            <b>AUFGABE</b>

            <br><br>

            ${mission.task}

        </div>

        <div class="riddle">

            🧩 ${mission.riddle}

        </div>

        <input
            id="answer"
            autocomplete="off"
            placeholder="Eure Lösung eingeben …"
        >

        <button id="check">

            Lösung prüfen

        </button>

        <div id="result"></div>

        <p class="small">

            Erst wenn die Lösung stimmt,
            bekommt ihr den nächsten Hinweis.

        </p>
    `;


    const input =
        document.getElementById("answer");

    const button =
        document.getElementById("check");

    const result =
        document.getElementById("result");


    button.onclick =
        async function () {

            const entered =
                input.value;

            const enteredHash =
                await createHash(
                    entered
                );


            /*
             * Die richtige Antwort wird
             * nur hier zum Vergleich verwendet.
             */

            const correctHash =
                await createHash(
                    mission.answer
                );


            if (
                enteredHash ===
                correctHash
            ) {

                result.className =
                    "result ok";

                result.innerHTML = `

                    ✅ <strong>Richtig!</strong>

                    <br><br>

                    ${mission.next}

                `;

                input.disabled = true;

                button.disabled = true;

            } else {

                result.className =
                    "result bad";

                result.innerHTML = `

                    ❌ Noch nicht.

                    <br>

                    Versucht es noch einmal!

                `;

            }

        };

}
